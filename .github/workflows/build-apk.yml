name: Build APK

on:
  workflow_dispatch:

  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'example/lib/**'
      - 'example/assets/**'
      - 'example/pubspec.yaml'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build example APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      # example/android is gitignored upstream; regenerate the platform shell in CI
      - name: Generate Android platform for example
        working-directory: example
        run: flutter create --platforms=android --org com.licoba --project-name liquid_glass_widgets_example .

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        working-directory: example
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-example-apks
          path: example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: example/build/app/outputs/flutter-apk/*.apk
